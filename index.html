<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="St. Teresa Gatura Girls Senior School, a Catholic CBC senior secondary school in Murang'a County, Kenya. Faith, Excellence, Discipline, Service."
    />
    <meta name="theme-color" content="#123325" />
    <style>
      html{background:#0c2218}
      body{margin:0}
      #boot{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;color:#fff;font-family:Georgia,'Times New Roman',serif;text-align:center;background:radial-gradient(ellipse 70% 55% at 50% 48%,rgba(45,128,89,.28),transparent 70%),linear-gradient(180deg,#0c2218,#06130d)}
      #boot img{height:5.5rem;width:auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.45));animation:boot-pulse 1.8s ease-in-out infinite}
      #boot p{margin:0;font:700 .6875rem/1.4 system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#ecce7c}
      #boot i{display:block;width:min(15rem,60vw);height:3px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden}
      #boot i::after{content:"";display:block;width:40%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#dcb04a,#f6e5b4);animation:boot-slide 1.3s ease-in-out infinite}
      @keyframes boot-pulse{50%{transform:scale(1.06)}}
      @keyframes boot-slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
      @media (prefers-reduced-motion:reduce){#boot img,#boot i::after{animation:none}}
    </style>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>St.Teresa Gatura Girls Senior School</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-label="Loading St. Teresa Gatura Girls Senior School">
        <img src="/logo.png" alt="" width="360" height="420" />
        <p>Setting off for Gatura</p>
        <i></i>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
